server:
  port: 8012
spring:
  application:
    name: configserver

  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          ignore-local-ssh-settings: true
          uri: ${GITHUB_CONFIG_URI:https://github.com/nikucse/erp-configuration.git}
          username: ${GITHUB_USERNAME:}
          password: ${GITHUB_TOKEN:}
          clone-on-start: true
          default-label: main

  sleuth:
    sampler:
      percentage: 1
  zipkin:
    base-url: http://localhost:9411