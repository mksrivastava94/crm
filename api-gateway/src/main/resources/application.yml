spring:
  config:
    import: optional:configserver:http://localhost:8012
  application:
    name: gateway

  sleuth:
    sampler:
      percentage: 1
    zipkin:
      base-url: http://localhost:9411

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        #user service actuator
        - id: user-service-actuator
          uri: lb://user
          predicates:
            - Path=/user/actuator/**
            - Method=GET
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/user/(?<segment>.*), /$\{segment}
        #user service routes
        - id: user-service
          uri: lb://user
          predicates:
            - Path=/api/v1/user/**
            - Header=Authorization, Bearer (.*)
          filters:
            - RemoveRequestHeader=Cookie
            - AuthorizationHeaderFilter
        #public user service routes
        - id: public-user-service
          uri: lb://user
          predicates:
            - Path=/api/v1/public/**
          filters:
            - RemoveRequestHeader=Cookie
        #profile service routes
        - id: profile-service
          uri: lb://profile
          predicates:
            - Path=/api/v1/profile/**
            #- Header=Authorization, Bearer (.*)
          filters:
            - RemoveRequestHeader=Cookie
            - AuthorizationHeaderFilter
        #profile service actuator
        - id: profile-service-actuator
          uri: lb://profile
          predicates:
            - Path=/profile-service/actuator/**
            - Method=GET
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/profile-service/(?<segment>.*), /$\{segment}
        # Employee Service Api
